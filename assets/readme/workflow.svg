    <rect x="328" y="100" width="260" height="5" rx="2.5" fill="#818CF8"/>
    <text x="344" y="132" fill="#818CF8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">02 / TONE</text>
    <text x="344" y="160" fill="#F1F5F9" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Select</text>
    <text x="344" y="188" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12">One of eight labels</text>

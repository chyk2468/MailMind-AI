    <text x="904" y="160" fill="#F1F5F9" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Gemini</text>
    <text x="904" y="188" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Review then copy</text>

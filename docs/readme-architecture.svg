e="12">Check the draft before sending.</text><circle cx="1124" cy="179" r="4" fill="#7D9BBA"><animate attributeName="r" values="3;5;3" dur="3.05s" repeatCount="indefinite"/></circle></g><circle r="4.5" fill="#65A99C"><animateMotion dur="7s" repeatCount="indefinite" path="M 288 236 L 344 236 L 568 236 L 632 236 L 856 236 L 920 236"/></circle><circle r="3" fill="#7D9BBA"><animateMotion dur="7s" begin="-3.5s" repeatCount="indefinite" path="M 288 236 L 344 236 L 568 236 L 632 236 L 856 236 L 920 236"/></circle><text x="56" y="358" fill="#9BAABD" font-family="Arial,sans-serif" font-size="12">Animated SVG preview. For clickable stage details, open docs/architecture.html.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc"><title id="title">MailMind-AI animated architecture</title><desc id="desc">Animated four-stage project workflow.</desc><rect width="1200" height="390" rx="18" fill="#101722"/><text x="56" y="42" fill="#7D9BBA" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">SYSTEM FLOW / ANIMATED</text><text x="56" y="80" fill="#E9EFF6" font-family="Arial,sans-serif" font-size="26" font-weight="700">MailMind-AI</text><text x="56" y="108" fill="#9BAABD" font-family="Arial,sans-serif" font-size="14">Follow the moving markers through each stage</text><line x1="56" y1="128" x2="1144" y2="128" stroke="#2B394B"/><path d="M 288 236 H 334" fill="none" stroke="#9BAABD" stroke-width="1.8"/><path d="M 328 231 L 334 236 L 328 241" fill="none" stroke="#9BAABD" stroke-width="1.8"/><path d="M 576 236 H 622" fill="none" stroke="#9BAABD" stroke-width="1.8"/><path d="M 616 231 L 622 236 L 616 241" fill="none" stroke="#9BAABD" stroke-width="1.8"/><path d="M 864 236 H 910" fill="none" stroke="#9BAABD" stroke-width="1.8"/><path d="M 904 231 L 910 236 L 904 241" fill="none" stroke="#9BAABD" stroke-width="1.8"/><g class="stage stage-0" tabindex="0"><rect x="56" y="154" width="224" height="164" rx="12" fill="#1A2634" stroke="#2B394B" stroke-width="1.4"/><rect x="56" y="154" width="224" height="5" rx="2.5" fill="#7D9BBA"/><text x="72" y="184" fill="#7D9BBA" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.3">MESSAGE</text><text x="72" y="219" fill="#E9EFF6" font-family="Arial,sans-serif" font-size="16" font-weight="700">Incoming email</text><text x="72" y="248" fill="#9BAABD" font-family="Arial,sans-serif" font-size="12">Provide the email and choose a tone.</text><circle cx="260" cy="179" r="4" fill="#7D9BBA"><animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/></circle></g><g class="stage 